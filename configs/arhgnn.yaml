seed: 42

paths:
  primary_data: data/IgAdata1.xlsx
  external_data: data/IgAdata2.xlsx
  output_dir: results_fixed

split:
  test_size: 0.2
  val_size: 0.2

features:
  categorical_max_unique: 8

hypergraph:
  quantile_bins: 4

imbalance:
  method: labelset_smote

model:
  hidden_channels: 64
  dropout: 0.5
  use_attention: true
  use_residual: true

training:
  epochs: 100
  learning_rate: 0.0005
  weight_decay: 0.0005
  patience: 50
  loss: bce

evaluation:
  threshold: 0.5
  bootstrap: 1000

