seed: 42

paths:
  # Private files: keep outside version control and obtain through controlled access.
  primary_data: data/private/IgAdata1.xlsx
  external_data: data/private/IgAdata2.xlsx
  output_dir: results_fixed

split:
  test_size: 0.2
  val_size: 0.2

features:
  categorical_max_unique: 8

hypergraph:
  quantile_bins: 4

imbalance:
  method: labelset_smote

model:
  hidden_channels: 32
  dropout: 0.5
  use_attention: true
  use_residual: true

training:
  epochs: 300
  learning_rate: 0.0005
  weight_decay: 0.0005
  patience: 50
  loss: bce

evaluation:
  threshold: 0.5
  bootstrap: 1000
  calibration:
    common_label_bins: 10
    sparse_label_bins: 5
    sparse_positive_cutoff: 20

reproducibility:
  patient_level_outputs: restricted
  write_results_manifest: true
